<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#3158dd"><title>List Rhythm · 单词打卡</title>
  <style>
    :root{--blue:#3158dd;--ink:#18243d;--muted:#6d7890;--line:#e1e7f0;--bg:#f4f6fb;--card:#fff;--green:#21725c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif}.top{min-height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px max(18px,calc((100vw - 1120px)/2))}.brand{display:flex;gap:11px;align-items:center;font-weight:800;font-size:21px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--blue);color:#fff}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.5px;font-weight:500}.account{display:flex;align-items:center;gap:10px}.saved{font-size:13px;color:var(--muted);text-align:right}.avatar{width:32px;height:32px;border-radius:50%;display:none}.userName{font-size:13px;font-weight:650;display:none}main{max-width:1120px;margin:auto;padding:32px 20px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{margin:0 0 7px;color:#7383a0;font-weight:750;font-size:11px;letter-spacing:1.8px}.intro h1{font-size:31px;margin:0 0 6px;letter-spacing:-1px}.intro>div>p:last-child{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}button,.linkbtn{border:1px solid #d7deea;background:#fff;color:var(--ink);border-radius:9px;padding:10px 13px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}button:hover,.linkbtn:hover{border-color:var(--blue)}button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650}.stats{background:#192b50;color:#fff;display:grid;grid-template-columns:repeat(3,1fr);border-radius:17px;padding:24px 27px;margin-bottom:24px}.stat+.stat{border-left:1px solid #3b4c6c;padding-left:27px}.stat span{font-size:13px;color:#b8c7e0}.stat strong{display:block;font-size:30px;margin-top:3px}.bar{height:6px;border-radius:10px;background:#3c4d6d;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#9ab2ff;transition:.2s}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden}.dayhead{display:flex;justify-content:space-between;align-items:center;padding:24px;border-bottom:1px solid var(--line)}.dayhead h2{font-size:25px;margin:0}.badge{font-size:12px;color:var(--blue);background:#edf1ff;padding:4px 8px;border-radius:6px;margin-left:7px;vertical-align:middle}.nav{display:flex;gap:6px}.nav button{padding:8px 11px}.progress{display:flex;gap:14px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}.progress .bar{flex:1;background:#e9edf5;margin:0}.progress .bar i{background:var(--blue)}.group{padding:21px 24px;border-bottom:1px solid var(--line)}.gtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.gtitle h3{font-size:16px;margin:0}.gtitle small{color:var(--muted)}.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.task{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.task:hover{background:#f8faff;border-color:#a8b9ed}.task.done{background:#eaf5f0;color:#376556}.task input{width:18px;height:18px;accent-color:var(--blue)}.task span{font-weight:600}.task small{color:var(--muted);margin-left:auto;font-size:11px}.footeract{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;color:var(--muted);font-size:13px}.calendar{padding:21px}.calendar h2{font-size:17px;margin:0}.calendar>p{font-size:12px;color:var(--muted);margin:4px 0 16px}.months h3{font-size:12px;color:var(--muted);margin:15px 0 8px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.grid button{height:35px;padding:0;font-size:12px;position:relative}.grid button.complete{background:#e5f4ee;color:var(--green);border-color:#cbe8dc}.grid button.partial{background:#eaf0ff;color:var(--blue)}.grid button.selected{background:var(--blue);color:#fff;border-color:var(--blue)}.tip{margin-top:18px;background:#eaf0fc;border:1px solid #dce4f5;border-radius:14px;padding:18px;color:#617494;font-size:12px}.tip strong{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17233d;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:760px){.top{min-height:70px}.saved,.userName{display:none!important}.account{gap:6px}main{padding:24px 14px}.intro{display:block}.actions{justify-content:flex-start;margin-top:15px}.stats{grid-template-columns:1fr 1fr;padding:20px}.stat:first-child{grid-column:1/-1;margin-bottom:13px}.stat+.stat{border:0;padding-left:0}.layout{grid-template-columns:1fr}.tasks{grid-template-columns:1fr}.dayhead{align-items:flex-start;gap:14px;flex-wrap:wrap}.footeract{flex-wrap:wrap;gap:12px}.footeract button{flex:1}.grid button{height:39px}}
  </style>
</head>
<body><header class="top"><div class="brand"><span class="logo">✓</span><span>List Rhythm<small>单词记忆计划</small></span></div><div class="account"><div><div class="userName" id="userName"></div><div class="saved" id="saved">未登录 · 进度保存在本设备</div></div><img class="avatar" id="avatar" alt="账号头像"><button id="auth">使用 Google 登录</button></div></header>
<main><section class="intro"><div><p class="eyebrow">YOUR DAILY PRACTICE</p><h1>一点点，记得更牢。</h1><p>从 List 87 出发，每天 4 个新 List，按 1、2、4、7、15、30 天复习。</p></div><div class="actions"><a class="linkbtn" href="index.html">← 返回首页</a><button id="share">导出备用链接</button><a class="linkbtn" href="https://docs.google.com/spreadsheets/d/1VJdJukjZH6TSQyCu59U6kaBxl1al5HsUlzLq5WM2mxk/edit" target="_blank">Google Sheet</a></div></section>
<section class="stats"><div class="stat"><span>已学 List</span><strong id="learned">13 / 100</strong><div class="bar"><i id="learnedBar" style="width:13%"></i></div></div><div class="stat"><span>已完成任务</span><strong id="doneTotal">0</strong></div><div class="stat"><span>完成整日打卡</span><strong id="doneDays">0 / 52</strong></div></section>
<div class="layout"><article class="panel"><div class="dayhead"><div><p class="eyebrow" id="dayNo">DAY 01 / 52</p><h2><span id="dateTitle"></span><span class="badge" id="dateBadge"></span></h2></div><div class="nav"><button id="prev" aria-label="前一天">←</button><button id="today">今天</button><button id="next" aria-label="后一天">→</button></div></div><div class="progress"><span id="dayCount"></span><div class="bar"><i id="dayBar"></i></div><b id="dayPercent"></b></div><div id="taskArea"></div><div class="footeract"><span>每完成一个 List，就勾选一次。</span><button class="primary" id="all">完成本日全部</button></div></article><aside><section class="panel calendar"><h2>52 天记忆日历</h2><p>点击日期，查看或补打卡</p><div class="months" id="months"></div></section><section class="tip"><strong>账号自动同步</strong>使用同一个 Google 账号登录手机、电脑或平板，打卡进度会自动同步。未登录时仍会保存在当前设备。</section></aside></div></main><div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCIM9nizod9fNNOoG-QXEkf5pChg78vih0",authDomain:"vocab-3642b.firebaseapp.com",projectId:"vocab-3642b",storageBucket:"vocab-3642b.firebasestorage.app",messagingSenderId:"853372181153",appId:"1:853372181153:web:65e5f63e3920354de72ee0",measurementId:"G-S21DN602H9"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let currentUser=null,cloudReady=false,unsubscribeCloud=null;
const START=new Date('2026-09-19T00:00:00+08:00'),GAPS=[1,2,4,7,15,30],KEY='list-rhythm-progress-v1';
const pad=n=>String(n).padStart(2,'0'),dateAt=d=>{const x=new Date(START);x.setDate(x.getDate()+d);return x},iso=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
function tasksAt(day){const a=[];for(let list=100;list>=1;list--){const learned=list>=88?0:Math.floor((87-list)/4),gap=day-learned;if(list<=87&&gap===0){a.push({id:`${day}:new:${list}`,list,kind:'new',stage:'首次学习'});a.push({id:`${day}:night:${list}`,list,kind:'night',stage:'睡前自测'});}if((list>=88&&day===0)||GAPS.includes(gap))a.push({id:`${day}:review:${list}`,list,kind:'review',stage:gap===0?'旧词重温':`第 ${gap} 天复习`});}return a}
const days=Array.from({length:52},(_,day)=>({day,date:dateAt(day),tasks:tasksAt(day)})),ids=days.flatMap(d=>d.tasks.map(t=>t.id));let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
function encode(){const bytes=[];for(let i=0;i<ids.length;i+=8){let b=0;for(let j=0;j<8;j++)if(state[ids[i+j]])b|=1<<j;bytes.push(b)}return btoa(String.fromCharCode(...bytes)).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')}
function decode(s){try{const raw=atob(s.replaceAll('-','+').replaceAll('_','/')),next={};ids.forEach((id,i)=>{if(raw.charCodeAt(i>>3)&(1<<(i&7)))next[id]=true});state=next;save();toast('已导入这份进度')}catch{toast('同步链接无效')}}
function statusText(s){document.querySelector('#saved').textContent=s}
async function pushCloud(){if(!currentUser||!cloudReady)return;try{statusText('正在同步…');await db.collection('users').doc(currentUser.uid).set({progress:state,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});statusText('已同步到云端 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}))}catch(e){console.error(e);statusText('云端同步失败 · 已保存在本设备')}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));statusText(currentUser?'已保存在本设备 · 等待同步':'未登录 · 已保存在本设备');render();pushCloud()}
const todayIndex=()=>Math.max(0,Math.min(51,Math.floor((new Date()-START)/86400000)));let selected=todayIndex();
function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function render(){const d=days[selected],done=d.tasks.filter(t=>state[t.id]).length,totalDone=ids.filter(id=>state[id]).length,newDone=days.flatMap(x=>x.tasks).filter(t=>t.kind==='new'&&state[t.id]).length,whole=days.filter(x=>x.tasks.every(t=>state[t.id])).length;document.querySelector('#learned').textContent=`${13+newDone} / 100`;document.querySelector('#learnedBar').style.width=(13+newDone)+'%';document.querySelector('#doneTotal').textContent=`${totalDone} / ${ids.length}`;document.querySelector('#doneDays').textContent=`${whole} / 52`;document.querySelector('#dayNo').textContent=`DAY ${pad(selected+1)} / 52`;document.querySelector('#dateTitle').textContent=`${d.date.getMonth()+1}月${d.date.getDate()}日`;document.querySelector('#dateBadge').textContent=selected===todayIndex()?'今天':selected<todayIndex()?'补打卡':'计划预览';document.querySelector('#dayCount').textContent=`${done} / ${d.tasks.length} 项已完成`;document.querySelector('#dayBar').style.width=(done/d.tasks.length*100)+'%';document.querySelector('#dayPercent').textContent=Math.round(done/d.tasks.length*100)+'%';document.querySelector('#prev').disabled=selected===0;document.querySelector('#next').disabled=selected===51;
 const info={new:['新词学习','分成两次，每次 2 个 List。'],review:['间隔复习','遮住释义自测，重点重背忘记的词。'],night:['睡前巩固','快速检查今天的新词。']};document.querySelector('#taskArea').innerHTML=['new','review','night'].map(kind=>{const list=d.tasks.filter(t=>t.kind===kind);if(!list.length)return'';return `<section class="group"><div class="gtitle"><div><h3>${info[kind][0]}</h3><small>${info[kind][1]}</small></div><small>${list.filter(t=>state[t.id]).length}/${list.length}</small></div><div class="tasks">${list.map(t=>`<label class="task ${state[t.id]?'done':''}"><input type="checkbox" data-id="${t.id}" ${state[t.id]?'checked':''}><span>List ${pad(t.list)}</span><small>${state[t.id]?'已完成':t.stage}</small></label>`).join('')}</div></section>`}).join('');document.querySelectorAll('[data-id]').forEach(e=>e.onchange=()=>{state[e.dataset.id]=e.checked;save()});renderCalendar()}
function renderCalendar(){const m=document.querySelector('#months');m.innerHTML=['09','10','11'].map(mm=>`<div><h3>2026 年 ${+mm} 月</h3><div class="grid">${days.filter(d=>pad(d.date.getMonth()+1)===mm).map(d=>{const n=d.tasks.filter(t=>state[t.id]).length,cl=n===d.tasks.length?'complete':n?'partial':'';return `<button data-day="${d.day}" class="${cl} ${d.day===selected?'selected':''}">${d.date.getDate()}</button>`}).join('')}</div></div>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=+b.dataset.day;render()})}
document.querySelector('#prev').onclick=()=>{selected--;render()};document.querySelector('#next').onclick=()=>{selected++;render()};document.querySelector('#today').onclick=()=>{selected=todayIndex();render()};document.querySelector('#all').onclick=()=>{days[selected].tasks.forEach(t=>state[t.id]=true);save()};document.querySelector('#share').onclick=async()=>{const url=location.origin+location.pathname+'#p='+encode();try{if(navigator.share)await navigator.share({title:'List Rhythm 进度备份',url});else{await navigator.clipboard.writeText(url);toast('备用链接已复制')}}catch{}};
document.querySelector('#auth').onclick=async()=>{if(currentUser){await auth.signOut();return}try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){console.error(e);if(e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request')await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());else toast('登录失败，请检查 Firebase 设置')}};
auth.onAuthStateChanged(async user=>{currentUser=user;cloudReady=false;if(unsubscribeCloud){unsubscribeCloud();unsubscribeCloud=null}const btn=document.querySelector('#auth'),name=document.querySelector('#userName'),avatar=document.querySelector('#avatar');if(!user){btn.textContent='使用 Google 登录';name.style.display='none';avatar.style.display='none';statusText('未登录 · 进度保存在本设备');return}btn.textContent='退出登录';name.textContent=user.displayName||user.email||'已登录';name.style.display='block';if(user.photoURL){avatar.src=user.photoURL;avatar.style.display='block'}statusText('正在连接云端…');try{const ref=db.collection('users').doc(user.uid),snap=await ref.get(),remote=snap.exists&&snap.data().progress?snap.data().progress:{};state={...remote,...state};localStorage.setItem(KEY,JSON.stringify(state));await ref.set({progress:state,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});cloudReady=true;render();statusText('已同步到云端');unsubscribeCloud=ref.onSnapshot(doc=>{if(!doc.exists||!cloudReady)return;const next=doc.data().progress||{};if(JSON.stringify(next)!==JSON.stringify(state)){state=next;localStorage.setItem(KEY,JSON.stringify(state));render();toast('已获取另一台设备的最新进度')}statusText('已同步到云端')},e=>{console.error(e);statusText('云端连接失败 · 已保存在本设备')})}catch(e){console.error(e);statusText('云端连接失败 · 已保存在本设备');toast('请检查 Firestore 和登录设置')}});
if(location.hash.startsWith('#p=')){decode(location.hash.slice(3));history.replaceState(null,'',location.pathname)}render();
</script></body></html>
