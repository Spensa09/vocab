<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3158dd"><title>Ella Hub · 学习仪表盘</title>
<style>

}.cardHead p{margin:3px 0 0;font-size:12px;color:var(--muted)}.calNav{display:flex;align-items:center;gap:6px}.calNav strong{min-width:105px;text-align:center}.calNav button{padding:7px 10px}.week{display:grid;grid-template-columns:repeat(7,1fr);padding:11px 14px 5px;color:var(--muted);font-size:11px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:5px 14px 16px}.day{min-height:90px;padding:7px;border:1px solid transparent;border-radius:10px;background:#fafbfe;cursor:pointer;overflow:hidden;text-align:left}.day:hover{border-color:#a9b8e6}.day.out{opacity:.38}.day.today{background:#edf1ff;border-color:#aebdf0}.day.selected{outline:2px solid var(--blue)}.daynum{font-size:12px;font-weight:700}.eventDot{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;border-radius:4px;padding:2px 5px;font-size:10px;background:#e9edfa;color:#3c579f}.agenda{border-top:1px solid var(--line);padding:16px 20px}.agendaTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.agendaTop h3{margin:0;font-size:15px}.eventRow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #eef1f6}.eventRow:first-child{border:0}.eventTime{width:52px;color:var(--blue);font-weight:650;font-size:12px}.eventText{flex:1}.eventText small{display:block;color:var(--muted)}.iconBtn{border:0;background:transparent;padding:5px;color:var(--muted)}.side{display:grid;gap:20px;align-content:start}.vocab{padding:21px;background:linear-gradient(145deg,#192b50,#3158dd);color:#fff;border:0}.vocab .eyebrow{color:#b9c8ef}.vocab h2{font-size:22px;margin:0 0 7px}.vocab p{color:#d6dff7;margin:0 0 17px;font-size:13px}.vocab .btn{display:inline-block;background:#fff;color:#2345b2;border:0;font-weight:700}.todoHead{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}.todoHead h2{margin:0;font-size:18px}.category{border-bottom:1px solid var(--line)}.catTitle{display:flex;align-items:center;gap:8px;padding:14px 18px;background:#fafbfe}.catTitle i{width:9px;height:9px;border-radius:50%}.catTitle strong{flex:1}.catTitle small{color:var(--muted)}.todoList{padding:4px 17px 12px}.todo{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #edf0f5}.todo:last-child{border:0}.todo input{margin-top:3px;width:17px;height:17px;accent-color:var(--blue)}.todoText{flex:1}.todoText.done{text-decoration:line-through;color:var(--muted)}.todoMeta{font-size:11px;color:var(--muted);margin-top:2px}.overdue{color:var(--red)}.empty{padding:18px;color:var(--muted);font-size:12px;text-align:center}.modal{position:fixed;inset:0;background:#111a2b99;display:none;place-items:center;padding:18px;z-index:10}.modal.open{display:grid}.dialog{width:min(500px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 70px #10182d33}.dialog h2{margin:0 0 17px;font-size:20px}.form{display:grid;gap:12px}.form label{font-size:12px;color:var(--muted)}.form input,.form select{display:block;width:100%;margin-top:5px;border:1px solid #d7deea;border-radius:9px;padding:10px;color:var(--ink);background:#fff}.formRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialogActions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.outlookBox{padding:18px 20px}.outlookBox h3{margin:0 0 5px;font-size:15px}.outlookBox p{margin:0 0 12px;color:var(--muted);font-size:12px}.outlookState{font-size:11px;color:var(--muted);margin-top:8px}@media(max-width:820px){.grid{grid-template-columns:1fr}.day{min-height:72px}.hero{display:block}.dateNow{display:block;margin-top:10px}.accountText{display:none}.calendar,.week{padding-inline:8px}.formRow{grid-template-columns:1fr}}@media(max-width:500px){main{padding:21px 11px}.brand small{display:none}.brand{font-size:17px}.top{padding-inline:12px}.day{min-height:59px;padding:5px}.eventDot{font-size:0;height:5px;width:5px;border-radius:50%;padding:0}.cardHead{align-items:flex-start;flex-wrap:wrap}.hero h1{font-size:26px}}
</style></head><body>
<header class="top"><div class="brand"><span class="logo">E</span><span>Ella Hub<small>STUDY DASHBOARD</small></span></div><div class="account"><div class="accountText"><div id="userName" class="userName"></div><div id="sync" class="sync">未登录 · 数据保存在本设备</div></div><img id="avatar" class="avatar" alt="账号头像"><button id="auth">使用 Google 登录</button></div></header>
<main><section class="hero"><div><p class="eyebrow">YOUR HOME</p><h1>今天，从清楚的计划开始。</h1><p>日程、任务和学习计划都在这里。</p></div><span id="dateNow" class="dateNow"></span></section><div class="grid">
<section class="card"><div class="cardHead"><div><h2>Calendar</h2><p>点击日期查看或添加事情</p></div><div class="calNav"><button id="prevMonth">←</button><strong id="monthTitle"></strong><button id="nextMonth">→</button><button id="todayBtn">今天</button></div></div><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendar" class="calendar"></div><div class="agenda"><div class="agendaTop"><h3 id="agendaTitle"></h3><button class="primary" id="addEvent">＋ 添加日程</button></div><div id="agendaList"></div></div></section>
<aside class="side"><section class="card vocab"><p class="eyebrow">VOCABULARY</p><h2>艾宾浩斯单词计划</h2><p>每天 4 个新 List，按 1、2、4、7、15、30 天自动安排复习。</p><a class="btn" href="vocab.html">进入单词打卡 →</a></section><section class="card"><div class="outlookBox"><h3>Outlook Calendar</h3><p>连接后可把 Outlook 日程显示在首页，并进行双向同步。</p><button id="outlook">连接 Outlook</button><div class="outlookState">Microsoft 网页授权配置完成后即可启用</div></div></section><section class="card"><div class="todoHead"><h2>To Do</h2><button id="addCategory">＋ 分类</button></div><div id="categories"></div></section></aside>
</div></main>
<div class="modal" id="eventModal"><div class="dialog"><h2>添加日程</h2><div class="form"><label>标题<input id="eventTitle" maxlength="80" placeholder="例如：Physics IA meeting"></label><div class="formRow"><label>日期<input id="eventDate" type="date"></label><label>时间<input id="eventTime" type="time"></label></div><label>备注<input id="eventNote" maxlength="120" placeholder="可选"></label></div><div class="dialogActions"><button data-close="eventModal">取消</button><button class="primary" id="saveEvent">保存</button></div></div></div>
<div class="modal" id="categoryModal"><div class="dialog"><h2>添加分类</h2><div class="form"><label>分类名称<input id="categoryName" maxlength="30" placeholder="例如：作业、竞赛"></label><label>颜色<select id="categoryColor"><option value="#3158dd">蓝色</option><option value="#7955c7">紫色</option><option value="#1d755a">绿色</option><option value="#d17b32">橙色</option><option value="#c84b4b">红色</option></select></label></div><div class="dialogActions"><button data-close="categoryModal">取消</button><button class="primary" id="saveCategory">创建</button></div></div></div>
<div class="modal" id="todoModal"><div class="dialog"><h2>添加任务</h2><div class="form"><input id="todoCategoryId" type="hidden"><label>任务内容<input id="todoTitle" maxlength="100" placeholder="要完成什么？"></label><div class="formRow"><label>截止日期<input id="todoDue" type="date"></label><label>循环<select id="todoRepeat"><option value="0">不循环</option><option value="1">每天</option><option value="7">每 7 天</option><option value="14">每 14 天</option><option value="30">每 30 天</option><option value="custom">自定义天数</option></select></label></div><label id="customRepeatWrap" style="display:none">每隔多少天<input id="customRepeat" type="number" min="1" max="365" value="3"></label></div><div class="dialogActions"><button data-close="todoModal">取消</button><button class="primary" id="saveTodo">保存</button></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCIM9nizod9fNNOoG-QXEkf5pChg78vih0",authDomain:"vocab-3642b.firebaseapp.com",projectId:"vocab-3642b",storageBucket:"vocab-3642b.firebasestorage.app",messagingSenderId:"853372181153",appId:"1:853372181153:web:65e5f63e3920354de72ee0",measurementId:"G-S21DN602H9"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),STORE='ella-hub-dashboard-v1';let user=null,cloudReady=false,unsubscribe=null,selected=new Date(),view=new Date(selected.getFullYear(),selected.getMonth(),1),data={events:[],categories:[]};try{data={...data,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{}
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(STORE,JSON.stringify(data));renderAll();if(user&&cloudReady){$('#sync').textContent='正在同步…';db.collection('users').doc(user.uid).set({dashboard:data,dashboardUpdatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).then(()=>$('#sync').textContent='已同步到云端').catch(()=>$('#sync').textContent='同步失败 · 已保存在本设备')}}function openModal(id){$('#'+id).classList.add('open')}function closeModal(id){$('#'+id).classList.remove('open')}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth();$('#monthTitle').textContent=`${y} 年 ${m+1} 月`;const first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),events=data.events.filter(e=>e.date===key).sort((a,b)=>(a.time||'').localeCompare(b.time||''));html+=`<button class="day ${d.getMonth()!==m?'out':''} ${key===iso(new Date())?'today':''} ${key===iso(selected)?'selected':''}" data-date="${key}"><span class="daynum">${d.getDate()}</span>${events.slice(0,3).map(e=>`<span class="eventDot">${esc(e.time?e.time+' '+e.title:e.title)}</span>`).join('')}</button>`}$('#calendar').innerHTML=html;document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.date+'T12:00:00');renderCalendar();renderAgenda()})}
function renderAgenda(){const key=iso(selected),list=data.events.filter(e=>e.date===key).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('#agendaTitle').textContent=`${selected.getMonth()+1}月${selected.getDate()}日 · ${['周日','周一','周二','周三','周四','周五','周六'][selected.getDay()]}`;$('#agendaList').innerHTML=list.length?list.map(e=>`<div class="eventRow"><span class="eventTime">${esc(e.time||'全天')}</span><div class="eventText">${esc(e.title)}${e.note?`<small>${esc(e.note)}</small>`:''}</div><button class="iconBtn" data-del-event="${e.id}">✕</button></div>`).join(''):'<div class="empty">这一天还没有日程</div>';document.querySelectorAll('[data-del-event]').forEach(b=>b.onclick=()=>{data.events=data.events.filter(e=>e.id!==b.dataset.delEvent);persist()})}
function dueText(t){if(!t.due)return t.repeatDays?`每 ${t.repeatDays} 天循环`:'';return `<span class="${t.due<iso(new Date())&&!t.done?'overdue':''}">截止 ${t.due}</span>${t.repeatDays?` · 每 ${t.repeatDays} 天循环`:''}`}function renderTodos(){const box=$('#categories');box.innerHTML=data.categories.length?data.categories.map(c=>{const todos=c.todos||[],done=todos.filter(t=>t.done).length;return `<section class="category"><div class="catTitle"><i style="background:${c.color}"></i><strong>${esc(c.name)}</strong><small>${done}/${todos.length}</small><button class="iconBtn" data-add-todo="${c.id}">＋</button><button class="iconBtn" data-del-cat="${c.id}">✕</button></div><div class="todoList">${todos.length?todos.map(t=>`<div class="todo"><input type="checkbox" data-check="${c.id}|${t.id}" ${t.done?'checked':''}><div class="todoText ${t.done?'done':''}">${esc(t.title)}<div class="todoMeta">${dueText(t)}</div></div><button class="iconBtn" data-del-todo="${c.id}|${t.id}">✕</button></div>`).join(''):'<div class="empty">点击＋添加任务</div>'}</div></section>`}).join(''):'<div class="empty">先创建“作业”“竞赛”等分类</div>';document.querySelectorAll('[data-add-todo]').forEach(b=>b.onclick=()=>{$('#todoCategoryId').value=b.dataset.addTodo;$('#todoTitle').value='';$('#todoDue').value=iso(new Date());$('#todoRepeat').value='0';$('#customRepeatWrap').style.display='none';openModal('todoModal')});document.querySelectorAll('[data-del-cat]').forEach(b=>b.onclick=()=>{if(confirm('删除这个分类和其中的任务？')){data.categories=data.categories.filter(c=>c.id!==b.dataset.delCat);persist()}});document.querySelectorAll('[data-del-todo]').forEach(b=>b.onclick=()=>{const[cid,tid]=b.dataset.delTodo.split('|'),c=data.categories.find(x=>x.id===cid);c.todos=c.todos.filter(t=>t.id!==tid);persist()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{const[cid,tid]=b.dataset.check.split('|'),t=data.categories.find(x=>x.id===cid).todos.find(x=>x.id===tid);if(b.checked&&t.repeatDays){if(t.due){const d=new Date(t.due+'T12:00:00');d.setDate(d.getDate()+t.repeatDays);t.due=iso(d)}t.done=false}else t.done=b.checked;persist()})}function renderAll(){renderCalendar();renderAgenda();renderTodos()}
$('#dateNow').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('#prevMonth').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCalendar()};$('#nextMonth').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar()};$('#todayBtn').onclick=()=>{selected=new Date();view=new Date(selected.getFullYear(),selected.getMonth(),1);renderAll()};$('#addEvent').onclick=()=>{$('#eventTitle').value='';$('#eventDate').value=iso(selected);$('#eventTime').value='';$('#eventNote').value='';openModal('eventModal')};$('#saveEvent').onclick=()=>{const title=$('#eventTitle').value.trim(),date=$('#eventDate').value;if(!title||!date)return alert('请填写标题和日期');data.events.push({id:uid(),title,date,time:$('#eventTime').value,note:$('#eventNote').value.trim()});closeModal('eventModal');persist()};$('#addCategory').onclick=()=>{$('#categoryName').value='';openModal('categoryModal')};$('#saveCategory').onclick=()=>{const name=$('#categoryName').value.trim();if(!name)return alert('请填写分类名称');data.categories.push({id:uid(),name,color:$('#categoryColor').value,todos:[]});closeModal('categoryModal');persist()};$('#todoRepeat').onchange=()=>$('#customRepeatWrap').style.display=$('#todoRepeat').value==='custom'?'block':'none';$('#saveTodo').onclick=()=>{const title=$('#todoTitle').value.trim(),c=data.categories.find(x=>x.id===$('#todoCategoryId').value);if(!title||!c)return alert('请填写任务内容');const v=$('#todoRepeat').value,repeatDays=v==='custom'?Math.max(1,+$('#customRepeat').value||1):+v;c.todos.push({id:uid(),title,due:$('#todoDue').value,repeatDays,done:false});closeModal('todoModal');persist()};$('#outlook').onclick=()=>alert('Outlook 网页同步还需要 Microsoft Entra 应用的 Client ID。当前可先使用首页日历；完成 Microsoft 授权配置后，这个按钮会用于连接账号。');
$('#auth').onclick=async()=>{if(user)return auth.signOut();const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}catch(e){if(e.code==='auth/popup-blocked')await auth.signInWithRedirect(p);else alert('登录失败，请检查 Firebase Authorized domains')}};auth.onAuthStateChanged(async u=>{user=u;cloudReady=false;if(unsubscribe){unsubscribe();unsubscribe=null}if(!u){$('#auth').textContent='使用 Google 登录';$('#userName').style.display=$('#avatar').style.display='none';$('#sync').textContent='未登录 · 数据保存在本设备';return}$('#auth').textContent='退出登录';$('#userName').textContent=u.displayName||u.email;$('#userName').style.display='block';if(u.photoURL){$('#avatar').src=u.photoURL;$('#avatar').style.display='block'}$('#sync').textContent='正在连接云端…';try{const ref=db.collection('users').doc(u.uid),snap=await ref.get(),remote=snap.exists?snap.data().dashboard:null;if(remote){data=remote;localStorage.setItem(STORE,JSON.stringify(data))}else await ref.set({dashboard:data,dashboardUpdatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});cloudReady=true;renderAll();$('#sync').textContent='已同步到云端';unsubscribe=ref.onSnapshot(s=>{const r=s.exists?s.data().dashboard:null;if(r&&JSON.stringify(r)!==JSON.stringify(data)){data=r;localStorage.setItem(STORE,JSON.stringify(data));renderAll()}$('#sync').textContent='已同步到云端'})}catch(e){console.error(e);$('#sync').textContent='云端连接失败 · 已保存在本设备'}});renderAll();
</script></body></html>
